[project]
name = "clinic-backend"
version = "0.1.0"
description = "Healthcare Appointment & Follow-up Manager with Real-Time Voice Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5.1",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "httpx>=0.27",
    "cryptography>=43.0",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "python-json-logger>=2.0",
    "icalendar>=6.0",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.149",
]

[project.optional-dependencies]
# No `voice` extra: speech runs entirely in the browser (Web Speech API for STT,
# speechSynthesis for TTS). faster-whisper, piper-tts and webrtcvad were removed
# with the server-side pipeline -- together roughly 1GB of wheels and model
# weights, which is what made a free-tier container viable.
rag = [
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "faker>=30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
