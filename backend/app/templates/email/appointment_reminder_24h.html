{% extends "base.html" %}
{% block content %}
<h1 style="font-size:20px;margin:0 0 16px;">Reminder: appointment tomorrow</h1>
<p>Hi {{ patient_name }},</p>
<p>Just a reminder that you have an appointment with <strong>{{ doctor_name }}</strong> tomorrow:</p>
<p style="background-color:#eff6ff;border-radius:8px;padding:16px;font-size:16px;font-weight:600;color:#1d4ed8;">
  {{ start_at | format_dt }}
</p>
<p>{{ clinic_name }}</p>
{% endblock %}
