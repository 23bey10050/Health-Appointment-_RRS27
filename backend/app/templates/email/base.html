<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ clinic_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
<tr>
  <td style="background-color:#2563eb;padding:20px 32px;">
    <span style="color:#ffffff;font-size:18px;font-weight:600;">{{ clinic_name }}</span>
  </td>
</tr>
{% block banner %}{% endblock %}
<tr>
  <td style="padding:32px;color:#0f172a;font-size:15px;line-height:1.6;">
    {% block content %}{% endblock %}
  </td>
</tr>
<tr>
  <td style="padding:20px 32px;background-color:#f8fafc;border-top:1px solid #e2e8f0;color:#64748b;font-size:12px;line-height:1.5;">
    This is an automated message from {{ clinic_name }}. Please do not reply directly to this email.
  </td>
</tr>
</table>
</td></tr>
</table>
</body>
</html>
