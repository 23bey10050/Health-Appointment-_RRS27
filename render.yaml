# Render Blueprint for the API - https://render.com/docs/blueprint-spec
#
# This is the free-tier plan the project's own cost budget (IMPLEMENTATION-PLAN.md section 3.4)
# assumes. On Render's dashboard: New -> Blueprint -> point it at this repo, and Render reads this
# file to provision the service below with the right build and start commands already filled in.
# Anything marked "sync: false" is a value only the account owner has (a real secret, or a URL that
# does not exist until the first deploy finishes) - Render prompts for those during setup rather
# than reading them from this file, so nothing secret ever needs to live in the repo.
#
# The web app itself (apps/web) is not listed here - it is a static site, deployed separately to
# Cloudflare Pages, with its own settings documented in docs/setup.txt.

services:
  - type: web
    name: health-appointment-api
    runtime: node
    plan: free
    region: oregon
    # Runs from the repo root, not apps/api, on purpose - this is an npm workspaces monorepo, and
    # `npm install` has to run at the root for @health/contracts to resolve correctly inside
    # @health/api. --include=dev is explicit rather than assumed, since a NODE_ENV=production
    # environment variable present during the build would otherwise make a bare `npm install` skip
    # the devDependencies tsc itself lives in.
    buildCommand: npm install --include=dev && npm run build --workspace @health/contracts && npm run build --workspace @health/api
    # Migrations run immediately before the server starts, against the real deployed database,
    # every single deploy - safe to run repeatedly, since Phase 1's migrator only ever applies what
    # has not already run. Both steps call the compiled output directly with plain `node`, not
    # `tsx`, so the start command has no dependency on anything that only lives in devDependencies.
    # Paths are relative to the repo root, the same as buildCommand above - Render runs every
    # command from there, not from apps/api, since rootDir is deliberately left unset (see the
    # comment on buildCommand).
    startCommand: node apps/api/dist/cli/migrate.js && node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # The exact Cloudflare Pages URL, once that deploy exists - see docs/setup.txt for the order
      # this actually happens in (API first, so this value exists before Pages needs VITE_API_URL
      # pointed back at it).
      - key: CORS_ORIGINS
        sync: false
      - key: SHUTDOWN_TIMEOUT_MS
        value: '10000'

      # --- Database (required) --- a free Neon project's pooled connection string. Neon closes
      # idle connections on its own side, which is what the pool tuning below is already set for.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: '10'
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: '20000'
      - key: DATABASE_CONNECT_TIMEOUT_MS
        value: '8000'

      # --- Auth (required) --- Render generates this one itself; nobody ever has to type it in.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: '900'
      - key: JWT_REFRESH_TTL_DAYS
        value: '30'

      # --- Email (optional) --- leave unset and confirmation/reminder emails print to this
      # service's own log instead of sending, the same fully-supported fallback local dev uses.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      # Not a secret, just a display name, so it gets a real default here rather than a blank
      # `sync: false` prompt - a field left blank in Render's dashboard can end up as an empty
      # string rather than a truly absent variable, and this one has no `.optional()` in the
      # app's own config schema to tolerate that.
      - key: BREVO_SENDER_NAME
        value: Health Appointment Clinic

      # --- AI summaries (optional) --- leave unset and both pre-visit and post-visit summaries
      # fall back to a plain, honest template message instead of an AI-written one.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # --- Google Calendar sync (optional) --- all four or none; leave unset and booking simply
      # creates no calendar event for anyone. GOOGLE_REDIRECT_URI must point at this exact
      # service's own public URL plus /auth/google/callback once that URL is known.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
